[pytest]
# Collection is scoped to tests/ on purpose. The notebooks directory holds Jupytext
# .py sources, and some of them match pytest's default *_test.py pattern (for
# example the natural-prevalence test-set builder), so an unscoped run tries to
# import them and fails on the Colab-only imports in their setup cells.
testpaths = tests
python_files = test_*.py
